    /* ── Design tokens (mirrors HOME_THEME in /index.html) ── */
    :root {
      --bg: #f7f9f8;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-2: #475569;
      --text-faint: #94a3b8;
      --accent: #2d6a4f;
      --accent-light: #40916c;
      --accent-soft: rgba(45,106,79,0.06);
      --accent-softer: rgba(45,106,79,0.03);
      --mint: #f0fdf4;
      --mint-text: #1b4332;
      --amber-bg: #fffbeb;
      --amber-text: #92400e;
      --amber-border: #fde68a;
      --font-heading: 'Poppins', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      font-family: var(--font-body); color: var(--text);
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

    /* ── Shell ── */
    .quiz-shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .quiz-top {
      height: 60px; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.92); border-bottom: 1px solid var(--border);
    }
    .brand {
      font-family: var(--font-heading); font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em;
      color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border-radius: 6px; background: var(--accent); color: #fff;
      font-family: var(--font-mono); font-weight: 700; font-size: 14px; line-height: 1;
    }
    .exit-link {
      font-size: 0.85rem; font-weight: 500; color: var(--text-2); text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px; padding: 0.4rem 0.6rem; border-radius: 8px;
    }
    .exit-link:hover { color: var(--text); background: rgba(15,23,42,0.04); }

    .quiz-main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem 3rem;
    }
    .card {
      width: 100%; max-width: 640px; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 40px rgba(15,23,42,0.06);
      padding: 2.25rem 2.25rem 2rem;
    }
    .enter { animation: cardIn 0.35s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .eyebrow {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.75rem;
    }
    .h1 {
      font-family: var(--font-heading); font-weight: 800; letter-spacing: -0.03em; line-height: 1.12;
      font-size: clamp(1.6rem, 4.5vw, 2.3rem); color: var(--text); margin-bottom: 1rem;
    }
    .h2 {
      font-family: var(--font-heading); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25;
      font-size: clamp(1.25rem, 3.6vw, 1.6rem); color: var(--text); margin-bottom: 1.5rem;
    }
    .h1:focus, .h2:focus { outline: none; }
    .lead { font-size: 1.02rem; line-height: 1.7; color: var(--text-2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 0.85rem 1.6rem; min-height: 48px; border-radius: 10px;
      font-family: var(--font-body); font-weight: 600; font-size: 0.98rem; text-decoration: none;
      cursor: pointer; border: 1px solid transparent; transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      text-align: center;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 16px rgba(45,106,79,0.19); }
    .btn-primary:hover { background: #245a42; }
    .btn-secondary { background: #fff; color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ghost {
      background: none; border: none; color: var(--text-2); font-weight: 500; font-size: 0.875rem;
      padding: 0.5rem 0.6rem; min-height: 40px; cursor: pointer; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-ghost:hover { color: var(--text); background: rgba(15,23,42,0.04); }
    .btn-ghost:disabled { opacity: 0.35; cursor: default; background: none; }

    /* ── Intro ── */
    .intro-meta {
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; margin: 1.5rem 0 2rem;
      font-size: 0.85rem; color: var(--text-2); font-weight: 500;
    }
    .intro-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .intro-meta i { color: var(--accent); }
    .fine { font-size: 0.78rem; color: var(--text-faint); margin-top: 1.25rem; line-height: 1.6; }

    /* ── Question ── */
    .q-head { display: flex; align-items: center; justify-content: space-between; margin: -0.5rem -0.5rem 0.75rem; }
    .q-count { font-size: 0.8rem; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; padding-right: 0.5rem; }
    .progress {
      height: 6px; width: 100%; background: #edf2f0; border-radius: 99px; overflow: hidden; margin-bottom: 1.75rem;
    }
    .progress > div {
      height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 99px; transition: width 0.35s cubic-bezier(.2,.7,.2,1);
    }
    .options { display: flex; flex-direction: column; gap: 0.75rem; list-style: none; }
    .option {
      width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 0.9rem;
      padding: 1rem 1.1rem; min-height: 64px; border-radius: 12px;
      background: #fff; border: 1.5px solid var(--border); cursor: pointer;
      font-size: 0.97rem; line-height: 1.5; color: var(--text);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.12s;
      touch-action: manipulation;
    }
    .option:hover { border-color: var(--accent-light); background: var(--accent-softer); }
    .option:disabled { cursor: default; }
    .option .key {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 7px; margin-top: -1px;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 0.8rem; font-weight: 700;
      background: #f1f5f9; color: var(--text-2); transition: background 0.15s, color 0.15s;
    }
    .option .opt-text { flex: 1; padding-top: 1px; }
    .option .tick { flex-shrink: 0; opacity: 0; color: var(--accent); font-size: 1.15rem; margin-top: 1px; transition: opacity 0.15s, transform 0.2s; transform: scale(0.6); }
    .option.is-selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(45,106,79,0.12); }
    .option.is-selected .key { background: var(--accent); color: #fff; }
    .option.is-selected .tick { opacity: 1; transform: scale(1); }
    .option.is-picking { animation: pick 0.25s ease; }
    @keyframes pick { 0% { transform: scale(1); } 40% { transform: scale(0.985); } 100% { transform: scale(1); } }
    .kbd-hint { margin-top: 1.25rem; font-size: 0.75rem; color: var(--text-faint); text-align: center; }
    .kbd-hint kbd {
      font-family: var(--font-mono); font-size: 0.7rem; padding: 0.1rem 0.35rem; border-radius: 4px;
      border: 1px solid var(--border); background: #f8fafc; color: var(--text-2);
    }

    /* ── Result ── */
    .shared-banner {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.9rem; margin-bottom: 1.5rem;
      background: var(--accent-softer); border: 1px dashed rgba(45,106,79,0.35); border-radius: 10px;
      font-size: 0.85rem; color: var(--mint-text);
    }
    .tier-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .tier-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 0.3rem 0.75rem; border-radius: 99px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .tier-pill.t1 { background: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
    .tier-pill.t2 { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .tier-pill.t3 { background: var(--mint); color: var(--accent); border: 1px solid #bbf7d0; }
    .score { display: flex; align-items: center; gap: 0.6rem; font-size: 0.8rem; color: var(--text-2); font-weight: 500; }
    .score strong { font-family: var(--font-mono); color: var(--text); font-size: 0.9rem; }
    .meter { display: flex; gap: 3px; }
    .meter span { width: 7px; height: 14px; border-radius: 2px; background: #e5ebe8; }
    .meter span.on { background: var(--accent); }
    .tier-title { font-family: var(--font-heading); font-weight: 600; font-size: 0.95rem; color: var(--text-2); margin-bottom: 0.4rem; }
    .callout {
      margin-top: 1.5rem; padding: 1.1rem 1.2rem; border-radius: 12px;
      background: var(--mint); border: 1px solid #d1fae5; display: flex; gap: 0.85rem;
    }
    .callout i { color: var(--accent); font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
    .callout h3 { font-family: var(--font-heading); font-size: 0.98rem; font-weight: 700; color: var(--mint-text); margin-bottom: 0.25rem; }
    .callout p { font-size: 0.9rem; line-height: 1.6; color: #2f5d47; }
    .cta-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.75rem; }
    .cta-row .btn { flex: 1 1 auto; }
    .result-foot {
      margin-top: 1.5rem; padding-top: 1.1rem; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;
    }
    .share { display: flex; gap: 0.25rem; flex-wrap: wrap; align-items: center; }
    .share-label { font-size: 0.78rem; color: var(--text-faint); margin-right: 0.25rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      .quiz-top { padding: 0 1rem; }
      .quiz-main { align-items: flex-start; padding: 1rem 0.75rem 2rem; }
      .card { padding: 1.5rem 1.15rem 1.35rem; border-radius: 16px; }
      .option { padding: 1rem; min-height: 68px; font-size: 0.95rem; }
      .cta-row { flex-direction: column; }
      .cta-row .btn { width: 100%; }
      .kbd-hint { display: none; }
      .intro-start { width: 100%; }
      .result-foot { flex-direction: column-reverse; align-items: stretch; }
      .share { justify-content: center; }
    }
    @media (hover: none) { .option:hover { border-color: var(--border); background: #fff; } .option.is-selected:hover { border-color: var(--accent); background: var(--accent-soft); } }
    @media (prefers-reduced-motion: reduce) {
      .enter, .option.is-picking { animation: none; }
      .progress > div, .option, .option .tick { transition: none; }
    }
  </style>

/* ═══════════════════════════════════════════════════════════
   START WITH A — "Is StartWithA Right for You?" Quiz
   One question per screen · auto-advance · no email gate.
   All state is client-side (v1, no backend).
   ═══════════════════════════════════════════════════════════ */

const { useState, useEffect, useRef, useCallback } = React;

/* ── CONFIG: swap these URLs when the blog / signup go live ── */
const QUIZ_CONFIG = {
  siteUrl: 'https://startwitha.xyz',
  homeUrl: '../',
  // Tier 1 primary — "The Kill Pile" blog

  // Tier 2 primary — signup / beta

  // Tier 2 secondary — 10-minute Market Sweep video

  // Tier 3 primary — signup / app

  // Tier 3 secondary — "How we kill 9 out of 10 ideas"

  autoAdvanceMs: 250,

/* ── ANALYTICS: provider-agnostic, no-op unless a provider is on window ──
   Nothing is loaded by this page. If Plausible / Umami / gtag / GTM is
   added later, events flow automatically. A DOM CustomEvent is also
   dispatched ('swa:analytics') for custom listeners. */
function track(event, props) {
  const p = props || {};
  try {
    const w = window;
    if (typeof w.plausible === 'function') w.plausible(event, { props: p });
    if (w.umami && typeof w.umami.track === 'function') w.umami.track(event, p);
    if (typeof w.gtag === 'function') w.gtag('event', event, p);
    else if (Array.isArray(w.dataLayer)) w.dataLayer.push({ event, ...p });
    w.dispatchEvent(new CustomEvent('swa:analytics', { detail: { event, props: p } }));
  } catch (e) { /* analytics must never break the quiz */ }
}

/* ── QUESTIONS (score: 0 = not a fit, 1 = building a process, 2 = core fit) ── */
const QUESTIONS = [
  {
    id: 'q1', topic: 'Idea Generation',
    prompt: 'How do you usually find new companies to research?',
    options: [
      { score: 0, text: 'Social media, Reddit, FinTwit, or market news.' },
      { score: 1, text: 'Stock screeners, podcasts, or occasional 13F filings.' },
      { score: 2, text: 'Systematic screening, reading filings, or working through markets methodically (e.g., starting with the A’s).' },
    ],
  },
  {
    id: 'q2', topic: 'Systematic Checklist',
    prompt: 'Do you follow a systematic checklist when analyzing a company?',
    options: [
      { score: 0, tag: 'no_checklist', text: 'No — I just look at the story, recent news, and valuation.' },
      { score: 1, tag: 'informal_checklist', text: 'Roughly — I have a mental checklist or scattered notes, but nothing structured.' },
      { score: 2, tag: 'formal_checklist', text: 'Yes — I have a written checklist or framework I run through before buying.' },
    ],
  },
  {
    id: 'q3', topic: 'Filtering Bad Ideas',
    prompt: 'When you spot an interesting company, what is your first instinct?',
    options: [
      { score: 0, text: 'Check the price chart and buy a small starter position to track it.' },
      { score: 1, text: 'Read a few summaries or analyst reports to see the bull case.' },
      { score: 2, text: 'Look for reasons to kill the idea quickly before spending 20 hours on it.' },
    ],
  },
  {
    id: 'q4', topic: 'Role of AI in Research',
    prompt: 'What do you want AI to do in your investing workflow?',
    options: [
      { score: 0, text: 'Tell me which stocks to buy or predict next quarter’s earnings.' },
      { score: 1, text: 'Summarize 10-Ks, earnings calls, and financial statements faster.' },
      { score: 2, text: 'Play devil’s advocate, surface counter-evidence, and catch my cognitive biases.' },
    ],
  },
  {
    id: 'q5', topic: 'Thesis Tracking',
    prompt: 'How do you remember why you bought a stock 18 months ago?',
    options: [
      { score: 0, text: 'I mostly keep it in my head.' },
      { score: 1, text: 'I have a few notes in a doc, spreadsheet, or brokerage app, though I rarely update them.' },
      { score: 2, text: 'I maintain a written thesis, checkpoints, or a decision journal (or actively want to).' },
    ],
  },
  {
    id: 'q6', topic: 'Handling Mistakes',
    prompt: 'When an investment goes wrong, what do you typically do?',
    options: [
      { score: 0, text: 'Sell it and move on to the next opportunity.' },
      { score: 1, text: 'Make a mental note not to do that again.' },
      { score: 2, text: 'Write a post-mortem so I can spot the exact pattern before I repeat it.' },
    ],
  },
  {
    id: 'q7', topic: 'Time Horizon',
    prompt: 'What is your typical holding period for a high-conviction idea?',
    options: [
      { score: 0, text: 'Days to a few months.' },
      { score: 1, text: '6 months to 2 years.' },
      { score: 2, text: '3+ years (I think like a business owner).' },
    ],
  },
];

const MAX_SCORE = QUESTIONS.length * 2; // 14
const OPTION_KEYS = ['A', 'B', 'C'];

/* ── RESULT TIERS ── */
function getTier(score) {
  if (score <= 4) return 1;
  if (score <= 9) return 2;
  return 3;
}

const TIERS = {
  1: {
    key: 'not_a_fit', pill: 'Not a fit', icon: 'bi-signpost-split',
    title: 'StartWithA is probably not for you.',
    headline: 'We’ll save you the time: StartWithA isn’t built for your style.',
    body: 'StartWithA is designed for slow, methodical, fundamental research—killing bad ideas early, running structured checklists, and auditing your own biases over multi-year holding periods. It won’t give you stock picks, price targets, or trading signals, so it would likely feel too rigid for how you invest.',
    primary: { id: 'kill_pile_blog', label: 'Read “The Kill Pile” Blog', href: QUIZ_CONFIG.killPileUrl, icon: 'bi-journal-text' },
    secondary: { id: 'retake', label: 'Retake Quiz', icon: 'bi-arrow-counterclockwise' },
    shareable: true,
  },
  2: {
    key: 'building_process', pill: 'Building a process', icon: 'bi-bricks',
    title: 'You’re building a real process.',
    headline: 'You’re ready to turn scattered research into a repeatable system.',
    body: 'You already care about fundamentals, but without a structured workflow, it’s easy for theses to drift and mistakes to repeat. StartWithA gives you the guardrails—from Kill Checklists to decision journals—so every hour of research compounds.',
    primary: { id: 'try_free', label: 'Try StartWithA Free', href: QUIZ_CONFIG.signupUrl, icon: 'bi-arrow-right' },
    secondary: { id: 'market_sweep_video', label: 'Watch a 10-Minute Market Sweep on YouTube', href: QUIZ_CONFIG.marketSweepVideoUrl, icon: 'bi-youtube' },
    shareable: false,
  },
  3: {
    key: 'core_fit', pill: 'Core fit', icon: 'bi-house-check',
    title: 'Built for how you already think.',
    headline: 'Welcome home. StartWithA was built for investors like you.',
    body: 'You don’t want AI to think for you—you want an operating system that challenges your assumptions, tracks how your thesis evolves, and keeps your research organized from Market Sweep to post-mortem.',
    primary: { id: 'start_research_project', label: 'Start Your First Research Project', href: QUIZ_CONFIG.appUrl, icon: 'bi-arrow-right' },
    secondary: { id: 'kill_ideas', label: 'See How We Kill 9 Out of 10 Ideas', href: QUIZ_CONFIG.killIdeasUrl, icon: 'bi-play-circle' },
    shareable: true,
  },
};

/* Dynamic checklist callout, driven by the Q2 tag */
function getCallout(tier, checklistType) {
  const formal = checklistType === 'formal_checklist';
  if (tier === 2) {
    return formal
      ? { icon: 'bi-upload', title: 'Bring your own checklist.', body: 'Upload your existing checklist document directly into StartWithA and turn it into an interactive workflow.' }
      : { icon: 'bi-ui-checks', title: 'Start with our built-in templates.', body: 'You don’t need to build a framework from scratch—StartWithA includes ready-to-use Value, Growth, and Kill Checklists you can customize as you learn.' };
  }
  if (tier === 3) {
    return formal
      ? { icon: 'bi-file-earmark-arrow-up', title: 'Import your checklist in seconds.', body: 'Drop in your existing research document and StartWithA will structure it into your personal workflow—then pair it with Argos to stress-test every item.' }
      : { icon: 'bi-clipboard2-check', title: 'Formalize your edge.', body: 'Start with our Value, Growth, or Kill Checklist templates and evolve them as you analyze more businesses.' };
  }
  return null;
}

/* ── SHARING ── */
function quizBaseUrl() {
  const { origin, pathname } = window.location;
  if (!origin || origin === 'null') return QUIZ_CONFIG.siteUrl + '/quiz/';
  return origin + pathname;
}
function buildShareUrl(score) {
  return `${quizBaseUrl()}?s=${score}`;
}
function buildShareText(tier, score) {
  if (tier === 1) return `StartWithA’s own quiz just told me NOT to use their product (${score}/${MAX_SCORE}). Respect for the honesty 😅`;
  return `Scored ${score}/${MAX_SCORE} on the StartWithA investor-process quiz: “Built for how you already think.” Kill checklists, decision journals, bias audits — finally.`;
}
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* Read a shared result (?s=<score>) — tier is always derived from the score */
function readSharedScore() {
  try {
    const raw = new URLSearchParams(window.location.search).get('s');
    if (raw === null || !/^\d{1,2}$/.test(raw)) return null;
    const n = parseInt(raw, 10);
    return n >= 0 && n <= MAX_SCORE ? n : null;
  } catch (e) { return null; }
}
function readPreselectedQ1() {
  try {
    const raw = new URLSearchParams(window.location.search).get('q1');
    if (raw === null || !/^[0-2]$/.test(raw)) return null;
    return parseInt(raw, 10);
  } catch (e) { return null; }
}
function clearSharedParam() {
  try { window.history.replaceState(null, '', window.location.pathname + window.location.hash); } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════
   SCREENS
   ═══════════════════════════════════════════════════════════ */
function useAutoFocus(dep) {
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.focus({ preventScroll: true }); }, [dep]);
  return ref;
}

function IntroScreen({ onStart }) {
  const headingRef = useAutoFocus('intro');
  return (
    <div className="card enter">
      <p className="eyebrow">60-second self-check</p>
      <h1 className="h1" ref={headingRef} tabIndex={-1}>Is StartWithA right for you?</h1>
      <p className="lead">
        StartWithA isn’t for everyone—and that’s by design. Answer 7 quick questions about how you research stocks, and we’ll tell you honestly whether it fits your process.
      </p>
      <div className="intro-meta">
        <span><i className="bi bi-list-ol"></i>7 questions</span>
        <span><i className="bi bi-stopwatch"></i>About 1 minute</span>
        <span><i className="bi bi-envelope-slash"></i>No email required</span>
      </div>
      <button className="btn btn-primary intro-start" onClick={onStart}>
        Start the quiz <i className="bi bi-arrow-right"></i>
      </button>
      <p className="fine">Your answers stay in your browser. Nothing is stored or sent anywhere.</p>
    </div>
  );
}

function QuestionScreen({ index, selected, onSelect, onBack }) {
  const q = QUESTIONS[index];
  const [picking, setPicking] = useState(null);
  const headingRef = useAutoFocus(index);

  // Reset local pick state whenever we land on a new question
  useEffect(() => { setPicking(null); }, [index]);

  const choose = useCallback((optIdx) => {
    if (picking !== null) return; // lock during the 250ms highlight
    setPicking(optIdx);
    onSelect(index, optIdx);
  }, [picking, index, onSelect]);

  // Keyboard: 1-3 or A-C to answer, Backspace / ← to go back
  useEffect(() => {
    const onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key.toLowerCase();
      const map = { '1': 0, '2': 1, '3': 2, a: 0, b: 1, c: 2 };
      if (k in map && map[k] < q.options.length) { e.preventDefault(); choose(map[k]); }
      else if ((k === 'backspace' || k === 'arrowleft') && picking === null) { e.preventDefault(); onBack(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [choose, onBack, picking, q.options.length]);

  const activeIdx = picking !== null ? picking : selected;
  const progressPct = ((index + 1) / QUESTIONS.length) * 100;

  return (
    <div className="card enter" key={q.id}>
      <div className="q-head">
        <button className="btn-ghost" onClick={onBack} disabled={picking !== null} aria-label={index === 0 ? 'Back to intro' : 'Previous question'}>
          <i className="bi bi-arrow-left"></i> Back
        </button>
        <span className="q-count" aria-live="polite">Question {index + 1} of {QUESTIONS.length}</span>
      </div>
      <div className="progress" role="progressbar" aria-valuemin={0} aria-valuemax={QUESTIONS.length} aria-valuenow={index + 1} aria-label="Quiz progress">
        <div style={{ width: `${progressPct}%` }}></div>
      </div>

      <p className="eyebrow">{q.topic}</p>
      <h2 className="h2" id={`${q.id}-prompt`} ref={headingRef} tabIndex={-1}>{q.prompt}</h2>

      <ul className="options" role="radiogroup" aria-labelledby={`${q.id}-prompt`}>
        {q.options.map((opt, i) => {
          const isSel = activeIdx === i;
          return (
            <li key={i}>
              <button
                type="button"
                role="radio"
                aria-checked={isSel}
                className={`option${isSel ? ' is-selected' : ''}${picking === i ? ' is-picking' : ''}`}
                onClick={() => choose(i)}
                disabled={picking !== null && picking !== i}
              >
                <span className="key" aria-hidden="true">{OPTION_KEYS[i]}</span>
                <span className="opt-text">{opt.text}</span>
                <i className="bi bi-check-circle-fill tick" aria-hidden="true"></i>
              </button>
            </li>
          );
        })}
      </ul>

      <p className="kbd-hint">Tip: press <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> to answer · <kbd>←</kbd> to go back</p>
    </div>
  );
}

function ScoreMeter({ score }) {
  return (
    <div className="score" aria-label={`Process score ${score} out of ${MAX_SCORE}`}>
      <span>Process score</span>
      <span className="meter" aria-hidden="true">
        {Array.from({ length: MAX_SCORE }).map((_, i) => <span key={i} className={i < score ? 'on' : ''}></span>)}
      </span>
      <strong>{score}/{MAX_SCORE}</strong>
    </div>
  );
}

function ResultScreen({ score, checklistType, shared, onRetake }) {
  const tierNum = getTier(score);
  const tier = TIERS[tierNum];
  const callout = shared ? null : getCallout(tierNum, checklistType);
  const [copied, setCopied] = useState(false);
  const headingRef = useAutoFocus(`result-${score}-${shared}`);

  const ctaProps = (ctaId) => ({ cta: ctaId, tier: tier.key, tier_number: tierNum, score, shared_view: !!shared });
  const isExternal = (href) => /^https?:\/\//.test(href);

  const renderLinkBtn = (cta, variant) => (
    <a
      className={`btn ${variant}`}
      href={cta.href}
      {...(isExternal(cta.href) ? { target: '_blank', rel: 'noopener' } : {})}
      onClick={() => track('quiz_cta_clicked', ctaProps(cta.id))}
    >
      {cta.icon && variant === 'btn-secondary' && <i className={`bi ${cta.icon}`}></i>}
      {cta.label}
      {cta.icon && variant === 'btn-primary' && <i className={`bi ${cta.icon}`}></i>}
    </a>
  );

  const handleRetake = (ctaId) => { track('quiz_cta_clicked', ctaProps(ctaId)); onRetake(); };

  const handleShareX = () => {
    track('quiz_cta_clicked', ctaProps('share_x'));
    const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(buildShareText(tierNum, score))}&url=${encodeURIComponent(buildShareUrl(score))}`;
    window.open(url, '_blank', 'noopener,width=600,height=520');
  };

  const handleCopy = async () => {
    track('quiz_cta_clicked', ctaProps('copy_link'));
    const ok = await copyText(buildShareUrl(score));
    if (ok) { setCopied(true); setTimeout(() => setCopied(false), 2000); }
  };

  return (
    <div className="card enter">
      {shared && (
        <div className="shared-banner">
          <i className="bi bi-share"></i>
          <span>Someone shared their result with you. Curious where you’d land?</span>
        </div>
      )}

      <div className="tier-row">
        <span className={`tier-pill t${tierNum}`}><i className={`bi ${tier.icon}`}></i>{tier.pill}</span>
        <ScoreMeter score={score} />
      </div>

      <p className="tier-title">{tier.title}</p>
      <h1 className="h1" ref={headingRef} tabIndex={-1}>{tier.headline}</h1>
      <p className="lead">{tier.body}</p>

      {callout && (
        <div className="callout">
          <i className={`bi ${callout.icon}`} aria-hidden="true"></i>
          <div>
            <h3>{callout.title}</h3>
            <p>{callout.body}</p>
          </div>
        </div>
      )}

      <div className="cta-row">
        {shared && (
          <button className="btn btn-primary" onClick={() => handleRetake('take_quiz_from_share')}>
            Take the quiz yourself <i className="bi bi-arrow-right"></i>
          </button>
        )}
        {renderLinkBtn(tier.primary, shared ? 'btn-secondary' : 'btn-primary')}
        {!shared && (tier.secondary.href
          ? renderLinkBtn(tier.secondary, 'btn-secondary')
          : (
            <button className="btn btn-secondary" onClick={() => handleRetake(tier.secondary.id)}>
              <i className={`bi ${tier.secondary.icon}`}></i>{tier.secondary.label}
            </button>
          ))}
      </div>

      <div className="result-foot">
        {/* Tier 1 already has Retake as its secondary CTA */}
        {!shared && tierNum !== 1
          ? <button className="btn-ghost" onClick={() => handleRetake('retake')}><i className="bi bi-arrow-counterclockwise"></i>Retake quiz</button>
          : <a className="btn-ghost" href={QUIZ_CONFIG.homeUrl} style={{ textDecoration: 'none' }}><i className="bi bi-house"></i>Back to homepage</a>}

        {tier.shareable && !shared && (
          <div className="share">
            <span className="share-label">Share your result</span>
            <button className="btn-ghost" onClick={handleShareX} aria-label="Share on X">
              <i className="bi bi-twitter-x"></i> Share on X
            </button>
            <button className="btn-ghost" onClick={handleCopy} aria-label="Copy result link">
              <i className={`bi ${copied ? 'bi-check2' : 'bi-link-45deg'}`}></i>{copied ? 'Copied!' : 'Copy link'}
            </button>
            <span className="sr-only" aria-live="polite">{copied ? 'Result link copied to clipboard' : ''}</span>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   APP ROOT
   ═══════════════════════════════════════════════════════════ */
function QuizApp() {
  const [sharedScore] = useState(readSharedScore);
  const [preselectedQ1] = useState(() => (sharedScore !== null ? null : readPreselectedQ1()));
  // step: 'intro' | 0..6 (question index) | 'result'
  const [step, setStep] = useState(() => {
    if (sharedScore !== null) return 'result';
    if (preselectedQ1 !== null) return 1;
    return 'intro';
  });
  const [answers, setAnswers] = useState(() => {
    const arr = Array(QUESTIONS.length).fill(null);
    if (preselectedQ1 !== null) arr[0] = preselectedQ1;
    return arr;
  });
  const [isShared, setIsShared] = useState(sharedScore !== null);
  const [runs, setRuns] = useState(preselectedQ1 !== null ? 1 : 0);
  const timerRef = useRef(null);

  useEffect(() => {
    if (preselectedQ1 !== null) {
      clearSharedParam();
      track('quiz_started', { retake: false, source: 'homepage_teaser' });
    }
  }, [preselectedQ1]);
  useEffect(() => () => clearTimeout(timerRef.current), []);
  useEffect(() => { window.scrollTo(0, 0); }, [step]);

  const score = answers.reduce((sum, a, i) => sum + (a === null ? 0 : QUESTIONS[i].options[a].score), 0);
  const q2Answer = answers[1];
  const checklistType = q2Answer === null ? null : QUESTIONS[1].options[q2Answer].tag;

  const start = useCallback(() => {
    clearTimeout(timerRef.current);
    if (isShared) { setIsShared(false); clearSharedParam(); }
    setAnswers(Array(QUESTIONS.length).fill(null));
    track('quiz_started', { retake: runs > 0 });
    setRuns(r => r + 1);
    setStep(0);
  }, [isShared, runs]);

  const select = useCallback((qIdx, optIdx) => {
    const next = answers.slice();
    next[qIdx] = optIdx;
    setAnswers(next);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => {
      if (qIdx < QUESTIONS.length - 1) {
        setStep(qIdx + 1);
      } else {
        const finalScore = next.reduce((s, a, i) => s + QUESTIONS[i].options[a].score, 0);
        const tierNum = getTier(finalScore);
        track('quiz_completed', {
          score: finalScore,
          tier: TIERS[tierNum].key,
          tier_number: tierNum,
          q2_checklist_type: QUESTIONS[1].options[next[1]].tag,
        });
        setStep('result');
      }
    }, QUIZ_CONFIG.autoAdvanceMs);
  }, [answers]);

  const back = useCallback(() => {
    clearTimeout(timerRef.current);
    setStep(s => (typeof s === 'number' && s > 0 ? s - 1 : 'intro'));
  }, []);

  let screen;
  if (step === 'intro') screen = <IntroScreen onStart={start} />;
  else if (step === 'result') screen = (
    <ResultScreen
      score={isShared ? sharedScore : score}
      checklistType={isShared ? null : checklistType}
      shared={isShared}
      onRetake={start}
    />
  );
  else screen = <QuestionScreen key={step} index={step} selected={answers[step]} onSelect={select} onBack={back} />;

  return (
    <div className="quiz-shell">
      <header className="quiz-top">
        <a className="brand" href={QUIZ_CONFIG.homeUrl}>
          <span className="brand-mark">A</span>
          Start with A
        </a>
        <a className="exit-link" href={QUIZ_CONFIG.homeUrl}>
          <i className="bi bi-x-lg"></i> <span>Exit quiz</span>
        </a>
      </header>
      <main className="quiz-main">{screen}</main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<QuizApp />);
  </script>
</body>
